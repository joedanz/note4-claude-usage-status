[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note4-claude"
version = "0.1.0"
description = "Claude plan usage and Anthropic status on a ZECTRIX NOTE4 Devkit e-paper display"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "Pillow>=10.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
note4-claude = "note4_claude.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/note4_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/joedanz/note4-claude-usage-status"
